name: Archive arXiv announcements

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,8 * * 1-5'
      timezone: America/New_York

permissions:
  contents: write

concurrency:
  group: arxiv-announcement-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check collector retry handling
        run: python -m unittest discover -s tests -p test_collector_http.py
      - run: python tools/collect_arxiv.py
      - name: Commit new snapshots
        shell: bash
        run: |
          git add sources/*.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive new arXiv announcement batches"
          git push
