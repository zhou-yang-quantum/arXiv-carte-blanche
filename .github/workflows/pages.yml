name: Publish arXiv carte blanche

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      audio_dates:
        description: 'Optional comma-separated dates to generate or reuse; blank processes all dates'
        type: string
        required: false
        default: ''
      reuse_audio_only:
        description: 'Publish available audio without starting speech synthesis'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    outputs:
      audio_result: ${{ steps.audio.outcome }}
      audio_dependencies_result: ${{ steps.audio_dependencies.outcome }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m unittest discover -s tests
      - uses: actions/cache@v4
        with:
          path: .cache/audio/voice
          key: kokoro-v1-af-heart-beb0d184-bca610b8-1
      - name: Prepare offline audio dependencies
        id: audio_dependencies
        if: ${{ !inputs.reuse_audio_only }}
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update -qq &&
               sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg espeak-ng &&
               python -m pip install --retries 5 -r requirements-speech.txt &&
               python -c 'from kokoro_onnx import Kokoro'; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 20))"; fi
          done
          echo '::error::Audio dependencies could not be installed after three attempts.'
          exit 1
      - name: Generate or reuse dated audio releases
        id: audio
        if: ${{ inputs.reuse_audio_only || steps.audio_dependencies.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIO_DATES: ${{ inputs.audio_dates }}
          REUSE_AUDIO_ONLY: ${{ inputs.reuse_audio_only }}
        run: |
          audio_options=()
          if [ "$REUSE_AUDIO_ONLY" = "true" ]; then
            audio_options+=(--reuse-only)
          fi
          if [ -n "$AUDIO_DATES" ]; then
            IFS=',' read -r -a dates <<< "$AUDIO_DATES"
            for stamp in "${dates[@]}"; do
              python tools/generate_audio.py --date "$stamp" "${audio_options[@]}"
            done
          else
            python tools/generate_audio.py "${audio_options[@]}"
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  audio-status:
    name: Verify audio outcome
    runs-on: ubuntu-24.04
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result == 'success' }}
    steps:
      - name: Report audio failures after text deployment
        env:
          AUDIO_RESULT: ${{ needs.build.outputs.audio_result }}
          DEPENDENCIES_RESULT: ${{ needs.build.outputs.audio_dependencies_result }}
        run: |
          if [ "$AUDIO_RESULT" != 'success' ]; then
            echo "::error::Text deployed, but audio did not complete. Dependencies: $DEPENDENCIES_RESULT; audio: $AUDIO_RESULT."
            exit 1
          fi
